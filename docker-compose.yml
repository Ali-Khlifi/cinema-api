version: '3.8'

services:
#  keycloak service
  keycloak:
    image: quay.io/keycloak/keycloak:latest
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8088:8080"
    command: start-dev

# api service
  cinemas-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cinemas-app
    ports:
      - "8082:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/db_cinema
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: admin
    depends_on:
      - db
      - keycloak
# database service
  db:
    image: postgres:15
    container_name: db-cinemas-app
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: db_cinema
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
