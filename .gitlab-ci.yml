# =============================================================================
# GitLab CI/CD — cinema-api
# Pipeline: test → (build || sonar) in parallel → publish
# =============================================================================

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH

stages:
  - test
  - build-quality
  - publish

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"

cache:
  key: "${CI_COMMIT_REF_SLUG}"
  paths:
    - .m2/repository

# -----------------------------------------------------------------------------
# TEST — runs tests + JaCoCo coverage report (used by sonar job)
# Requires GitLab CI variable: none
# -----------------------------------------------------------------------------
test:
  stage: test
  image: maven:3.9-eclipse-temurin-17
  script:
    - mvn verify -B
  artifacts:
    paths:
      - target/site/jacoco/jacoco.xml
      - target/classes
    expire_in: 1 day
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

# -----------------------------------------------------------------------------
# BUILD — runs in parallel with sonar after test
# -----------------------------------------------------------------------------
build:
  stage: build-quality
  image: maven:3.9-eclipse-temurin-17
  script:
    - mvn package -DskipTests -B
  artifacts:
    paths:
      - target/cinemas-app-*.jar
    expire_in: 1 week
  needs:
    - job: test
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

# -----------------------------------------------------------------------------
# SONAR — code quality analysis on SonarCloud (parallel with build)
# Requires GitLab CI variable: SONAR_TOKEN (from sonarcloud.io → My Account → Security)
# -----------------------------------------------------------------------------
sonar:
  stage: build-quality
  image: maven:3.9-eclipse-temurin-17
  variables:
    SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"
    GIT_DEPTH: "0"
  cache:
    key: "${CI_COMMIT_REF_SLUG}-sonar"
    paths:
      - .sonar/cache
      - .m2/repository
  script:
    # Fail fast with a clear message if token or project config is wrong
    - |
      if [ -z "$SONAR_TOKEN" ]; then
        echo "ERROR: SONAR_TOKEN is empty. Add it in GitLab → Settings → CI/CD → Variables."
        echo "If variable is Protected, it is only available on protected branches."
        exit 1
      fi
      VALID=$(curl -s -u "${SONAR_TOKEN}:" "https://sonarcloud.io/api/authentication/validate" | grep -o '"valid":true' || true)
      if [ -z "$VALID" ]; then
        echo "ERROR: SONAR_TOKEN is invalid or expired. Generate a new token on sonarcloud.io → My Account → Security."
        exit 1
      fi
      echo "SonarCloud token OK"
    - |
      # Analyze the current Git branch (develop in CI), not main
      if [ -n "$CI_MERGE_REQUEST_IID" ]; then
        SONAR_ARGS="-Dsonar.pullrequest.key=$CI_MERGE_REQUEST_IID \
          -Dsonar.pullrequest.branch=$CI_MERGE_REQUEST_SOURCE_BRANCH_NAME \
          -Dsonar.pullrequest.base=$CI_MERGE_REQUEST_TARGET_BRANCH_NAME"
        echo "SonarCloud: merge request analysis ($CI_MERGE_REQUEST_SOURCE_BRANCH_NAME → $CI_MERGE_REQUEST_TARGET_BRANCH_NAME)"
      else
        SONAR_ARGS="-Dsonar.branch.name=$CI_COMMIT_REF_NAME"
        echo "SonarCloud: branch analysis ($CI_COMMIT_REF_NAME)"
      fi
      mvn compile sonar:sonar -DskipTests -Dsonar.token=$SONAR_TOKEN $SONAR_ARGS -B
  needs:
    - job: test
      artifacts: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "develop"
    - if: $CI_COMMIT_BRANCH == "main"
  allow_failure: true

# -----------------------------------------------------------------------------
# PUBLISH — Docker image to GitLab Container Registry (develop / main only)
# -----------------------------------------------------------------------------
publish:
  stage: publish
  image: docker:24
  services:
    - docker:24-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
    IMAGE_TAG: $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  script:
    - docker build -t "$IMAGE_TAG" -t "$CI_REGISTRY_IMAGE:latest" .
    - docker push "$IMAGE_TAG"
    - docker push "$CI_REGISTRY_IMAGE:latest"
  needs:
    - job: build
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "develop"
