# =============================================================================
# GitLab CI/CD — cinema-api
# Step-by-step setup: add one stage at a time, push, verify in GitLab → CI/CD → Pipelines
# =============================================================================

# Avoid duplicate pipelines: if an MR is open, run MR pipeline only (not branch + MR)
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH

stages:
  - test
  - build
  - publish

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"

# Reuse downloaded Maven dependencies between pipeline runs
cache:
  key: "${CI_COMMIT_REF_SLUG}"
  paths:
    - .m2/repository

# -----------------------------------------------------------------------------
# STEP 1 — TEST
# Runs unit + integration tests on every push and merge request
# -----------------------------------------------------------------------------
test:
  stage: test
  image: maven:3.9-eclipse-temurin-17
  script:
    - mvn test -B
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

# -----------------------------------------------------------------------------
# STEP 2 — BUILD (add when Step 1 passes)
# Produces the JAR artifact for the publish stage
# -----------------------------------------------------------------------------
build:
  stage: build
  image: maven:3.9-eclipse-temurin-17
  script:
    - mvn package -DskipTests -B
  artifacts:
    paths:
      - target/cinemas-app-*.jar
    expire_in: 1 week
  needs:
    - job: test
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

# -----------------------------------------------------------------------------
# STEP 3 — PUBLISH (add when Step 2 passes)
# Builds and pushes Docker image to GitLab Container Registry
# Requires: Settings → General → Visibility → Container Registry enabled
# -----------------------------------------------------------------------------
publish:
  stage: publish
  image: docker:24
  services:
    - docker:24-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
    IMAGE_TAG: $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  script:
    - docker build -t "$IMAGE_TAG" -t "$CI_REGISTRY_IMAGE:latest" .
    - docker push "$IMAGE_TAG"
    - docker push "$CI_REGISTRY_IMAGE:latest"
  needs:
    - job: build
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "develop"
