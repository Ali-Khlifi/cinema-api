# City API - Cinema Management System
# Defines endpoints for city operations

openapi: 3.0.0
info:
  description: 'City API for Cinema Management'
  title: 'City API'
  version: '0.0.1'
paths:
  /city:
    get:
      tags:
        - City
      summary: 'Get all cities'
      operationId: findAll
      responses:
        '200':
          description: 'OK'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CityOpenApiModel'
    post:
      tags:
        - City
      summary: 'Create a new city'
      operationId: create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CityOpenApiModel'
      responses:
        '201':
          description: CREATED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CityOpenApiModel'
    put:
      tags:
        - City
      summary: 'Update existing city'
      operationId: update
      requestBody:
        description: 'Update existing city'
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CityOpenApiModel'
      responses:
        '200':
          description: 'OK'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CityOpenApiModel'
        '404':
          description: 'NOT FOUND'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /city/{id}:
    get:
      tags:
        - City
      summary: 'Get specific city'
      operationId: findOne
      parameters:
        - name: id
          in: path
          description: 'Find city by id'
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: 'OK'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CityOpenApiModel'
        '404':
          description: 'NOT FOUND'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags:
        - City
      summary: 'Delete a city'
      operationId: delete
      parameters:
        - name: id
          in: path
          description: 'Find a city by its id'
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: DELETED
        '404':
          description: 'NOT FOUND'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  schemas:
    'CityOpenApiModel':
      description: 'Object representing a city'
      type: object
      required:
        - name
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string

    Error:
      description: 'Error message format for HTTP responses'
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: integer
        message:
          type: string
