version: '3.8'

services:
#  keycloak service
  keycloak:
    image: quay.io/keycloak/keycloak:26.1.0
    container_name: keycloak
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8088:8080"
    depends_on:
      - db-keycloak
    command: start-dev

# Database for Keycloak
  db-keycloak:
    image: postgres:15
    container_name: db-keycloak
    environment:
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: password
      POSTGRES_DB: db_keycloak
    ports:
      - "5433:5432" # Port différent pour éviter un conflit
    volumes:
      - keycloak-data:/var/lib/postgresql/data


  # Database for API cinemas-app
  db:
    image: postgres:15
    container_name: db-cinemas-app
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: db_cinema
    volumes:
      - cinemas-data:/var/lib/postgresql/data


# API service
  cinemas-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cinemas-app
    ports:
      - "8082:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/db_cinema
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: admin
    depends_on:
      - db
      - keycloak

volumes:
  cinemas-data:
  keycloak-data:


