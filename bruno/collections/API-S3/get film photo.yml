info:
  name: get film photo
  type: http
  seq: 2

http:
  method: GET
  url: "{{base_url}}/api/filmProjection/byRoom?roomId=1"
  headers:
    - name: Authorization
      value: "Bearer {{access_token}}"
  params:
    - name: roomId
      value: "1"
      type: query

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
