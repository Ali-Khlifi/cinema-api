info:
  name: Poster film photo
  type: http
  seq: 1

http:
  method: POST
  url: "{{base_url}}/api/films/1/poster"
  body:
    type: multipart-form
    data:
      - name: file
        type: file
        value:
          - D:\AutoFormations\AutoFormation_2023\Gestion-Cinema\cinema-api\images\needForSpeed.jpg
        contentType: image/jpeg
