info:
  name: import films
  type: http
  seq: 1

http:
  method: POST
  url: "{{base_url}}/api/films/import/tmdb"
  headers:
    - name: Authorization
      value: "Bearer {{access_token}}"
  auth: none

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
