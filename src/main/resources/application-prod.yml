# Production Configuration - Gestion Cinéma
# This file is used when SPRING_PROFILES_ACTIVE=prod

spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME:cinema_user}
    password: ${DATABASE_PASSWORD}
  
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  
  flyway:
    enabled: true
    baseline-on-migrate: true
    validate-on-migrate: true
  
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI}

server:
  port: ${PORT:8080}

# Required in production. ProdS3StartupCheck rejects a missing bucket, region, or AWS credentials.
cinema:
  storage:
    s3:
      bucket: ${CINEMA_S3_BUCKET:}
      region: ${CINEMA_S3_REGION:}
      key-prefix: ${CINEMA_S3_KEY_PREFIX:posters/}
      max-bytes: ${CINEMA_S3_MAX_BYTES:5242880}
      presign-ttl-seconds: ${CINEMA_S3_PRESIGN_SECONDS:900}
  tmdb:
    api-key: ${CINEMA_TMDB_API_KEY:}
  compression:
    enabled: true

# CORS Configuration
web:
  cors:
    allowed-origins: ${FRONTEND_URL:https://cinema-uga.netlify.app}

# Logging
logging:
  level:
    root: INFO
    fr.uga.gestioncinema: INFO
    org.springframework.security: INFO

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-components: always
      show-details: never

# Application info (version from pom.xml)
info:
  app:
    name: '@project.name@'
    version: '@project.version@'
    description: '@project.description@'
    groupId: '@project.groupId@'
    artifactId: '@project.artifactId@'

