version: '3.8'

services:

  # Databases (start first)

  # Database for Keycloak
  db-keycloak:
    image: postgres:15
    container_name: db-keycloak
    environment:
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: password
      POSTGRES_DB: db_keycloak
    ports:
      - "5433:5432" # new port
    volumes:
      - keycloak-data:/var/lib/postgresql/data

  # Database for kong
  db-kong:
    image: postgres:15
    container_name: db-kong
    environment:
      POSTGRES_USER: kong
      POSTGRES_PASSWORD: kong
      POSTGRES_DB: kong
    volumes:
      - kong-data:/var/lib/postgresql/data

  # Database for API cinemas-app
  db:
    image: postgres:15
    container_name: db-cinemas-app
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: db_cinema
    volumes:
      - cinemas-data:/var/lib/postgresql/data

#  keycloak service
  keycloak:
    image: quay.io/keycloak/keycloak:26.1.0
    container_name: keycloak
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://db-keycloak:5432/db_keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: password
    volumes:
      - ./keycloak:/opt/keycloak/data/import
    ports:
      - "8088:8080"
    depends_on:
      - db-keycloak
    command: start-dev --import-realm

  # Service for init kong
  kong-migrations:
    image: kong:3.3
    command: [ "kong", "migrations", "bootstrap" ]
    environment:
      KONG_DATABASE: postgres
      KONG_PG_HOST: db-kong
      KONG_PG_USER: kong
      KONG_PG_PASSWORD: kong
    depends_on:
      - db-kong


  #kong service
  kong:
    build:
      context: .
      dockerfile: Dockerfile.kong
    volumes:
      - ./kong-config/kong.yml:/etc/kong/kong.yml
    env_file:
      - ./kong-config/kong-env.conf
    container_name: kong
    ports:
      - "8000:8000"   # Admin API
      - "8001:8001"   # Proxy
    environment:
      KONG_PLUGINS: bundled,oidc
      KONG_PLUGINSERVER_oidc_QUERY_CMD: "/usr/local/bin/kong-oidc"
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
    depends_on:
      - db-kong
      - kong-migrations
      - keycloak

  # API service
  cinemas-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cinemas-app
    ports:
      - "8082:8082"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/db_cinema
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: admin
    depends_on:
      - db
      - keycloak

volumes:
  cinemas-data:
  keycloak-data:
  kong-data:


