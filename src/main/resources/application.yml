# Logging configuration
logging:
 level:
  org.hibernate.tool.hbm2ddl: debug

# Database configuration (PostgreSQL)
spring:
 datasource:
  url: jdbc:postgresql://localhost:5432/db_cinema
  username: postgres
  password: admin
  driver-class-name: org.postgresql.Driver
 jpa:
  database-platform: org.hibernate.dialect.PostgreSQLDialect
  show-sql: true
  hibernate:
   ddl-auto: none
  properties:
   hibernate:
    format_sql: true
 flyway:
  schemas: public
  enabled: true
  encoding: utf-8
  baseline-on-migrate: false
  locations: classpath:db/migration
  create-schemas: true
