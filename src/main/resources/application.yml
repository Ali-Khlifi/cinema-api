# Logging configuration
logging:
 level:
  org.hibernate.tool.hbm2ddl: debug
  org.springframework.security: DEBUG
  org.springframework.security.oauth2: DEBUG

server:
 port: 8082

spring:
 # security and keycloak integration
 security:
  oauth2:
    client:
     registration:
      keycloak:
       client-id: cinemas-app-client
       scope: openid, profile, email, offline_access
       authorization-grant-type: authorization_code
       redirect-uri: http://localhost:8082/login/oauth2/code/cinemas-app-client
     provider:
      keycloak:
       issuer-uri: http://localhost:8088/realms/cinemas-app
       user-name-attribute: preferred_username
    resourceserver:
     jwt:
      issuer-uri: http://localhost:8088/realms/cinemas-app
      set-uri: http://localhost:8088/realms/cinemas-app/protocol/openid-connect/certs


 # Database configuration (PostgresSQL)
 datasource:
  url: jdbc:postgresql://localhost:5432/db_cinema
  username: postgres
  password: admin
  driver-class-name: org.postgresql.Driver
 jpa:
  database-platform: org.hibernate.dialect.PostgreSQLDialect
  show-sql: true
  hibernate:
   ddl-auto: none
  properties:
   hibernate:
    format_sql: true
 flyway:
  schemas: public
  enabled: true
  encoding: utf-8
  baseline-on-migrate: false
  locations: classpath:db/migration
  create-schemas: true

 servlet:
  multipart:
   max-file-size: 10MB
   max-request-size: 10MB
 logging:
  level:
   org.hibernate.SQL: debug
   org.hibernate.type.descriptor.sql.BasicBinder: trace
   org.springframework: error

