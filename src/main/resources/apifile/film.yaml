# replace film to define the default model covered by this document, first letter must be uppercase
# replace film to define the default path of endpoints in this document, first letter must be lowercase
# add missing endpoints
# N.B. : must then be added to the pom to generate the controller and its associated models

openapi: '3.0.0'
info:
  description: 'Film API'
  version: '0.0.1'
  title: 'OpenAPI Film'
tags:
  - name: Film
paths:
  /film:
    get:
      tags:
        - Film
      summary: 'all Films'
      operationId: findAll
      responses:
        '200':
           description: 'OK'
           content:
              application/json:
                schema:
                  type: array
                  items:
                      $ref: '#/components/schemas/FilmOpenApiModel'
    post:
      tags:
        - Film
      summary: 'create new film'
      operationId: create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FilmOpenApiModel'
      responses:
        '201':
          description: CREATED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FilmOpenApiModel'
    put:
      tags:
        - Film
      summary: 'Update existing film'
      operationId: update
      requestBody:
        description: 'Update existing film'
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FilmOpenApiModel'

      responses:
        '200':
          description: 'OK'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FilmOpenApiModel'

        '404':
          description: 'NOT FOUND'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /film/{id}:
    get:
      tags:
        - Film
      summary: 'Specific Film'
      operationId: findOne
      parameters:
        - name: id
          in: path
          description: 'Find a Film by its id'
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: 'OK'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FilmOpenApiModel'
        '404':
          description: 'NOT FOUND'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags:
        - Film
      summary: 'delete a Film'
      operationId: delete
      parameters:
        - name: id
          in: path
          description: 'Find a Film by its id'
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: DELETED
        '404':
          description: 'NOT FOUND'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /films/{id}/media:
    post:
      tags:
        - Film
      summary: 'Upload media for a film'
      operationId: uploadMedia
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: 'The media file to upload'
              required:
                - file
      responses:
        '200':
          description: 'OK saved media successfully'
        '400':
          description: 'Bad request, incorrect or missing parameters'
    get:
      tags:
        - Film
      summary: 'Download media from a film'
      operationId: readMedia
      parameters:
        - name: id
          in: path
          description: 'Find media film by its id'
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: 'OK succeeded to get media file'
          content:
            "*/*":
              schema:
                type: string
                format: byte
        '404':
          description: 'NOT FOUND'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  schemas:
    'FilmOpenApiModel':
      description: 'Object representing a film/movie'
      type: object
      required:
          - title
          - duration
          - director
          - description
          - releaseDate
          - categoryId
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
          description: 'Title of the film'
        duration:
          type: number
          format: double
          description: 'Duration in minutes'
        director:
          type: string
          description: 'Director of the film'
        description:
          type: string
          description: 'Synopsis/description of the film'
        releaseDate:
          type: string
          format: date
          description: 'Release date of the film'
        categoryId:
          type: integer
          format: int64
          description: 'ID of the film category/genre'

    'FilmProjectionOpenApiModel':
      type: object
      properties:
        id:
          type: integer
          format: int64
        startTime:
          type: string
          format: date-time
          description: 'Start time of the projection'
        endTime:
          type: string
          format: date-time
          description: 'End time of the projection'
        basePrice:
          type: number
          format: double
          description: 'Base price for this projection'

    Error:
      description: 'format message for error return HTTP'
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: integer
        message:
          type: string






