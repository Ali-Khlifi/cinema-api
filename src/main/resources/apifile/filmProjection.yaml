# replace filmProjection to define the default model covered by this document, first letter must be uppercase
# replace filmProjection to define the default path of endpoints in this document, first letter must be lowercase
# add missing endpoints
# N.B. : must then be added to the pom to generate the controller and its associated models

openapi: '3.0.0'
info:
  description: 'FilmProjection API'
  version: '0.0.1'
  title: 'OpenAPI FilmProjection'
tags:
  - name: FilmProjection
paths:
  /filmProjection:
    get:
      tags:
        - FilmProjection
      summary: 'all FilmProjections'
      operationId: findAll
      responses:
        '200':
           description: 'OK'
           content:
              application/json:
                schema:
                  type: array
                  items:
                      $ref: '#/components/schemas/FilmProjectionOpenApiModel'
    post:
      tags:
        - FilmProjection
      summary: 'create new filmProjection'
      operationId: create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FilmProjectionOpenApiModel'
      responses:
        '201':
          description: CREATED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FilmProjectionOpenApiModel'
    put:
      tags:
        - FilmProjection
      summary: 'Update existing filmProjection'
      operationId: update
      requestBody:
        description: 'Update existing filmProjection'
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FilmProjectionOpenApiModel'

      responses:
        '200':
          description: 'OK'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FilmProjectionOpenApiModel'

        '404':
          description: 'NOT FOUND'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /filmProjection/{id}:
    get:
      tags:
        - FilmProjection
      summary: 'Specific FilmProjection'
      operationId: findOne
      parameters:
        - name: id
          in: path
          description: 'Find a FilmProjection by its id'
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: 'OK'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FilmProjectionOpenApiModel'
        '404':
          description: 'NOT FOUND'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags:
        - FilmProjection
      summary: 'delete a FilmProjection'
      operationId: delete
      parameters:
        - name: id
          in: path
          description: 'Find a FilmProjection by its id'
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: DELETED
        '404':
          description: 'NOT FOUND'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /filmProjection/byRoom:
    get:
      tags:
        - FilmProjection
      summary: 'Film projections by room'
      operationId: findByRoom
      parameters:
        - name: roomId
          in: query
          description: 'Find projections by room'
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: 'OK'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FilmProjectionOpenApiModel'
        '404':
          description: 'NOT FOUND'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  schemas:
    'FilmProjectionOpenApiModel':
      description: 'Object representing a film projection/showtime'
      type: object
      required:
          - projectionDate
          - startTime
          - endTime
          - roomId
      properties:
        id:
          type: integer
          format: int64
        projectionDate:
          type: string
          format: date
          description: 'Date of the projection'
        startTime:
          type: string
          description: 'Start time of the projection (HH:mm:ss format)'
          example: '14:30:00'
        endTime:
          type: string
          description: 'End time of the projection (HH:mm:ss format)'
          example: '16:45:00'
        maxProjections:
          type: integer
          description: 'Maximum projections per day'
        filmId:
          type: integer
          format: int64
          description: 'ID of the film being projected'
        film:
          $ref: '#/components/schemas/FilmOpenApiModel'
        roomId:
          type: integer
          format: int64
          description: 'ID of the room/hall'

    'FilmOpenApiModel':
      description: 'Object representing a film/movie'
      type: object
      required:
        - title
        - duration
        - director
        - description
        - releaseDate
        - categoryId
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
          description: 'Title of the film'
        duration:
          type: number
          format: double
          description: 'Duration in minutes'
        director:
          type: string
          description: 'Director of the film'
        description:
          type: string
          description: 'Synopsis/description of the film'
        releaseDate:
          type: string
          format: date
          description: 'Release date of the film'
        categoryId:
          type: integer
          format: int64
          description: 'ID of the film category/genre'

    Error:
      description: 'format message for error return HTTP'
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: integer
        message:
          type: string






