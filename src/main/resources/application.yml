spring:
  application:
    name: cinemas-app
  datasource:
    url: jdbc:postgresql://localhost:5432/db_cinema
    username: postgres
    password: admin
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
  flyway:
    schemas: public
    enabled: true
    encoding: utf-8
    baseline-on-migrate: false
    locations: classpath:db/migration
    create-schemas: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8088/realms/cinemas-app
          jwk-set-uri: http://localhost:8088/realms/cinemas-app/protocol/openid-connect/certs

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: 8082
  servlet:
    context-path: /api

keycloak:
  auth-server_url: http://localhost:8088
  realm: cinemas-app
  resource: cinemas-app-client
  credentials:
    secret: iAMf2UoLD0SrT4zslz7uvqJ24l1kTKiK

# Stripe Payment Configuration
stripe:
  api-key: sk_test_51Sgr9pIsAB9sduavWz5UuyeXZ5I9S3xEnewuzaj1u6wicNwYfHuWnBoZgkQrhfFApKVjFdZmJ2WGde03g8OFlGlv00Xyuesejc
  webhook-secret: whsec_xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
  currency: EUR

web:
  cors:
    allowed-origins: "http://localhost:4200"

# Poster storage. Empty in local dev until a bucket exists.
# Credentials are AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY, never written here.
cinema:
  storage:
    s3:
      bucket: ${CINEMA_S3_BUCKET:}
      region: ${CINEMA_S3_REGION:}
      key-prefix: ${CINEMA_S3_KEY_PREFIX:posters/}

logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.type.descriptor.sql.BasicBinder: trace
    org.springframework.security: DEBUG
    org.springframework.security.oauth2: DEBUG
  file:
    name: ./logs/cinemas-app.log
    path: ./logs

