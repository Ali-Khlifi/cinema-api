version: '3.8'

services:

  # Databases (start first)

  # Database for Keycloak
  db-keycloak:
    image: postgres:15
    container_name: db-keycloak
    environment:
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: password
      POSTGRES_DB: db_keycloak
    ports:
      - "5433:5432" # new port
    volumes:
      - keycloak-data:/var/lib/postgresql/data
    networks:
      - kong-net

  # Database for kong
#  db-kong:
#    image: postgres:15
#    container_name: db-kong
#    environment:
#      POSTGRES_USER: kong
#      POSTGRES_PASSWORD: kong
#      POSTGRES_DB: kong
#    volumes:
#      - kong-data:/var/lib/postgresql/data

  # Database for API cinemas-app
  db:
    image: postgres:15
    container_name: db-cinemas-app
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: db_cinema
    volumes:
      - cinemas-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U keycloak -d db_keycloak" ]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - kong-net

#  keycloak service
  keycloak:
    image: quay.io/keycloak/keycloak:26.1.0
    container_name: keycloak
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://db-keycloak:5432/db_keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: password
    volumes:
      - ./keycloak:/opt/keycloak/data/import
    ports:
      - "8088:8080"
    depends_on:
      - db-keycloak
    networks:
      - kong-net
    command: start-dev --import-realm

  # Service for init kong
#  kong-migrations:
#    build: .
#    container_name: kong-migrations
#    command: [ "kong", "migrations", "bootstrap" ]
#    environment:
#      KONG_DATABASE: postgres
#      KONG_PG_HOST: db-kong
#      KONG_PG_USER: kong
#      KONG_PG_PASSWORD: kong
#    depends_on:
#      - db-kong

  #kong service
  kong:
    image: kong:2.8.4-alpine
    container_name: kong
    user: kong
    volumes:
      - ./kong-config:/opt/kong:ro
    ports:
      - "8000:8000"  # Proxy
      - "8001:8001"  # Admin
      - "8443:8443"  # SSL
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: "/opt/kong/kong.yml"
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_PROXY_LISTEN: "0.0.0.0:8000"
      KONG_ADMIN_LISTEN: "0.0.0.0:8001"
#      KONG_LUA_PACKAGE_PATH: "/kong-plugins/?.lua;;"
      KONG_PLUGINS: bundled,oidc
#      KONG_PLUGINSERVER_oidc_QUERY_CMD: "/kong-oidc"

    healthcheck:
      test: [ "CMD", "kong", "health" ]
      interval: 10s
      timeout: 10s
      retries: 10
    restart: on-failure
    networks:
     - kong-net
    depends_on:
    - keycloak

  # API service
  cinemas-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cinemas-app
    ports:
      - "8082:8082"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/db_cinema
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: admin
    networks:
      - kong-net
    depends_on:
      - db
      - keycloak

networks:
  kong-net:
      name: kong-net
      driver: bridge

volumes:
  cinemas-data:
  keycloak-data:


